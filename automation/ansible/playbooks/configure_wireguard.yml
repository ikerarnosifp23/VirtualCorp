---
- name: 1. Generar o leer las claves del cliente
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Claves del cliente
      ansible.builtin.include_role:
        name: wireguard_client
        tasks_from: keys.yml

- name: 2. Configurar el servidor WireGuard en mikrotik0
  hosts: mikrotik0
  gather_facts: false
  vars:
    wg_client_public_key: "{{ hostvars['localhost']['wg_client_public_key'] }}"
  roles:
    - wireguard_server

- name: 3. Escribir el fichero del cliente
  hosts: localhost
  gather_facts: false
  vars:
    wg_server_public_key: "{{ hostvars['mikrotik0']['wg_server_public_key'] }}"
  tasks:
    - name: Fichero del cliente
      ansible.builtin.include_role:
        name: wireguard_client
        tasks_from: config.yml
